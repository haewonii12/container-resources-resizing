apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-api
  namespace: inference
  labels:
    app: sample-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-api
  template:
    metadata:
      labels:
        app: sample-api
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:1.0
          args: ["-text=sample-api", "-listen=:5678"]
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api
  namespace: inference
spec:
  selector:
    app: sample-api
  ports:
    - port: 80
      targetPort: 5678
