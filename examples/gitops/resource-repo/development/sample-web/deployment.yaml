apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  namespace: development
  labels:
    app: sample-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-web
  template:
    metadata:
      labels:
        app: sample-web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-web
  namespace: development
spec:
  selector:
    app: sample-web
  ports:
    - port: 80
      targetPort: 80
