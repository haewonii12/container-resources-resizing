# GENERATED by scripts/gen_alerts.py - do not edit by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rightsizing
  namespace: rightsizing
  labels:
    release: PROMETHEUS_RELEASE_LABEL_PLACEHOLDER
spec:
  groups:
    - name: rightsizing.recording
      interval: 1m
      rules:
        - record: rightsizing:pod_workload:owner
          expr: max by (namespace, pod, workload, workload_kind) (label_replace(label_replace(label_replace(kube_pod_owner{namespace=~"development|inference",owner_kind="ReplicaSet"}, "replicaset", "$1", "owner_name", "(.*)") * on (namespace, replicaset) group_left (owner_name) max by (namespace, replicaset, owner_name) (kube_replicaset_owner{owner_kind="Deployment"}), "workload", "$1", "owner_name", "(.*)"), "workload_kind", "Deployment", "", ""))
        - record: rightsizing:pod_workload:owner
          expr: max by (namespace, pod, workload, workload_kind) (label_replace(label_replace(kube_pod_owner{namespace=~"development|inference",owner_kind="StatefulSet"}, "workload", "$1", "owner_name", "(.*)"), "workload_kind", "StatefulSet", "", ""))
        - record: rightsizing:container_cpu_usage:rate5m
          expr: max by (namespace, workload_kind, workload, container) (rate(container_cpu_usage_seconds_total{namespace=~"development|inference",container!="",container!="POD",image!=""}[5m]) * on (namespace, pod) group_left (workload, workload_kind) rightsizing:pod_workload:owner)
        - record: rightsizing:container_memory_working_set:bytes
          expr: max by (namespace, workload_kind, workload, container) (container_memory_working_set_bytes{namespace=~"development|inference",container!="",container!="POD",image!=""} * on (namespace, pod) group_left (workload, workload_kind) rightsizing:pod_workload:owner)
    - name: rightsizing.alerts
      rules:
        - alert: RightsizingJobFailed
          expr: kube_job_status_failed{namespace="rightsizing",job_name!~"gitops-mirror.*"} > 0 and on (job_name) (time() - kube_job_status_start_time{namespace="rightsizing",job_name!~"gitops-mirror.*"} < 86400)
          labels:
            severity: warning
          annotations:
            summary: rightsizing job failed (exit 2 = infrastructure, exit 3 = security refusal)
            description: 'Check the job logs: kubectl -n rightsizing logs job/{{ $labels.job_name }} -c agent'
        - alert: RightsizingJobNotRun
          expr: time() - kube_cronjob_status_last_successful_time{namespace="rightsizing",cronjob="rightsizing"} > 2 * 86400
          labels:
            severity: warning
          annotations:
            summary: rightsizing CronJob has not succeeded for 2 days
        - alert: MirrorJobFailed
          expr: kube_job_status_failed{namespace="rightsizing",job_name=~"gitops-mirror.*"} > 0 and on (job_name) (time() - kube_job_status_start_time{namespace="rightsizing",job_name=~"gitops-mirror.*"} < 86400)
          labels:
            severity: warning
          annotations:
            summary: gitops-mirror job failed (exit 2 = infrastructure, exit 4 = safety halt)
            description: exit 4 = mass-delete guard, Application with resources finalizer (delete it manually) or Application name conflict. kubectl -n rightsizing logs job/{{ $labels.job_name }}
        - alert: MirrorJobNotRun
          expr: time() - kube_cronjob_status_last_successful_time{namespace="rightsizing",cronjob="gitops-mirror"} > 2 * 86400
          labels:
            severity: warning
          annotations:
            summary: gitops-mirror CronJob has not succeeded for 2 days
        - alert: TargetWorkloadOOM
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"inference|development"}[30m]) > 0 and on (namespace, pod, container) kube_pod_container_status_last_terminated_reason{namespace=~"inference|development",reason="OOMKilled"} == 1
          labels:
            severity: warning
          annotations:
            summary: OOMKilled in {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }})
            description: "If a rightsizing commit was synced recently: git log --grep 'Rightsizing-Workload: {{ $labels.namespace }}/' ; git revert <sha> and sync to roll back."
