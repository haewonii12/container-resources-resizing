apiVersion: v1
kind: ConfigMap
metadata:
  name: rightsizing-config
  namespace: rightsizing
data:
  # Every *_PLACEHOLDER must be replaced before the first run. Secrets are NOT here (see README: rightsizing-secrets).
  config.yaml: |
    # Target namespaces: any namespace with an entry under `policies` (not kube-system/kube-public/kube-node-lease/
    # argocd/rightsizing). After changing this list run: python scripts/gen_namespaces.py && python scripts/gen_alerts.py
    namespaces: [inference, development]
    policies:
      inference:
        label: inference (conservative)
        request_multiplier: 1.3
        mem_limit_multiplier: 1.5
        max_shrink: 0.25
        max_increase: 2.0
      development:
        label: development (aggressive)
        request_multiplier: 1.1
        mem_limit_multiplier: 1.2
        max_shrink: 0.50
        max_increase: 2.0
    window_days: 7          # 14 recommended for inference once enough history exists
    min_days: 3
    min_change: 0.10
    throttle_threshold: 0.05
    suppress_days: 14
    cpu_limit_mode: keep
    prometheus:
      url: http://PROMETHEUS_URL_PLACEHOLDER:9090
      use_recording_rules: true
    llm:
      base_url: http://LLM_BASE_URL_PLACEHOLDER/v1
      model: MODEL_PLACEHOLDER
      max_turns: 8
    git:
      url: https://GITEA_HOST_PLACEHOLDER/ORG_PLACEHOLDER/MANIFEST_REPO_PLACEHOLDER.git
      branch: main
      username: rightsizing-bot
      author_name: rightsizing-bot
      author_email: rightsizing-bot@example.invalid
      push_enabled: false   # DV7: enable only after the dry-run coverage review (README "Coverage gate")
      head_is_branch: true
    mcp:
      url: http://127.0.0.1:9080/mcp
    argocd:
      namespace: argocd
      tracking_method: annotation+label   # ArgoCD v2.12 default is label tracking
      kustomize_build_options: []   # copy kustomize.buildOptions from argocd-cm if set (e.g. --enable-helm)
    timeouts:
      prom: 30
      llm_turn: 60
      llm_total: 300
      git: 120
      render: 120
      mcp_connect: 60
      run_budget: 5400
    mirror:
      namespaces: [inference, development]   # subset of `namespaces`; omit to use the same list
      argocd_project: gitops-mirror
      min_confirmations: 2
      min_missing_interval_hours: 12
      max_deletes_per_run: 3
      max_delete_ratio: 0.3
      min_apps_for_ratio: 5
      skip_helm: true
    report:
      # Daily report + rightsizing run record. MUST be a different repo from git.url; the bot needs write on it.
      # Create the repo (and the bot's write permission) BEFORE enabling this, or rightsizing exits 2.
      git_url: http://GITEA_HOST_PLACEHOLDER/ORG_PLACEHOLDER/REPORT_REPO_URL_PLACEHOLDER.git
      branch: main
      node_role_prefix: node-role.kubernetes.io/   # N-1 moves pods only between nodes of the same role
      runs_enabled: true          # rightsizing pushes runs/YYYY/MM/<date>.json (independent of git.push_enabled)
      wait_for_record_minutes: 10
      timezone: Asia/Seoul
    manual_mappings: []
    # - workload: development/Deployment/web
    #   values_file: values-dev.yaml
    #   values_key: web.resources
    secret_dir: /var/run/secrets/rightsizing
