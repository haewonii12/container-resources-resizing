---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rightsizing-app-reader
  namespace: argocd
rules:
  # DV1: read ArgoCD Applications (auto-sync guard, source mapping, sync status)
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rightsizing-app-reader
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
