apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitops-mirror
  namespace: rightsizing
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitops-mirror
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:  # DNS
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - ports:  # kube-apiserver (any address, apiserver ports only)
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    - to:  # in-cluster Gitea
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
      ports:
        - {protocol: TCP, port: 3000}
