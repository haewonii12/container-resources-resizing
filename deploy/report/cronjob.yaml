apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-report
  namespace: rightsizing
spec:
  # after rightsizing (03:00 + activeDeadlineSeconds 5700 = 04:35); the job also waits up to
  # report.wait_for_record_minutes for today's run record
  schedule: "0 5 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: daily-report
        spec:
          serviceAccountName: daily-report
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: report
              image: AGENT_IMAGE_PLACEHOLDER
              command: ["python", "-m", "rightsizing.report"]
              args: ["--config", "/etc/rightsizing/config.yaml", "--workdir", "/work"]
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {memory: 512Mi}
              volumeMounts:
                - {name: config, mountPath: /etc/rightsizing, readOnly: true}
                - {name: secrets, mountPath: /var/run/secrets/rightsizing, readOnly: true}
                - {name: work, mountPath: /work}
                - {name: tmp, mountPath: /tmp}
                - {name: home, mountPath: /home/rightsizing}
          volumes:
            - name: config
              configMap: {name: rightsizing-config}
            - name: secrets
              secret:
                secretName: rightsizing-secrets
                defaultMode: 0440
                items:
                  - {key: gitea_token, path: gitea_token}   # never the LLM key
            - {name: work, emptyDir: {}}
            - {name: tmp, emptyDir: {}}
            - {name: home, emptyDir: {}}
