[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rightsizing"
version = "0.1.0"
description = "Approval-gated CPU/memory rightsizing agent for Kubernetes (kubectl-ai MCP -> Gitea -> ArgoCD manual sync)"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.50",
  "httpx>=0.27",
  "kubernetes>=31",
  "ruamel.yaml>=0.18",
  "pydantic>=2.10",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
rightsizing = "rightsizing.main:cli"

[tool.setuptools.packages.find]
include = ["rightsizing*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "binaries: requires helm and kustomize binaries on PATH",
]
